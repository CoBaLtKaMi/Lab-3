version: '3.9'

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: sportclub
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - sport-net

  redis:
    image: redis:7-alpine
    networks:
      - sport-net

  api:
    build:
      context: ./SportClubApi      # ← правильный путь к папке с Dockerfile
      dockerfile: Dockerfile
    environment:
      CONNECTION_STRING: "Host=db;Port=5432;Database=sportclub;Username=postgres;Password=postgres"
      REDIS_CONNECTION: "redis:6379"
      ASPNETCORE_URLS: "http://+:8080"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - sport-net

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
    networks:
      - sport-net

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - sport-net

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - sport-net

volumes:
  pgdata:
  grafana-data:

networks:
  sport-net:
    driver: bridge