<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Клиентский портал — SportClub</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: #f0f4f8;
            color: #333;
            min-height: 100vh;
        }

        header {
            background: linear-gradient(135deg,#1a6e1a,#28a745);
            color: #fff;
            padding: 16px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

            header h1 {
                font-size: 20px;
            }

        #user-info {
            font-size: 14px;
            background: rgba(255,255,255,.2);
            padding: 6px 14px;
            border-radius: 20px;
        }

        nav {
            background: #fff;
            box-shadow: 0 2px 8px rgba(0,0,0,.08);
            display: flex;
            gap: 4px;
            padding: 10px 30px;
        }

            nav button {
                background: none;
                border: none;
                padding: 8px 18px;
                border-radius: 6px;
                cursor: pointer;
                font-size: 14px;
                font-weight: 600;
                color: #555;
                transition: all .2s;
            }

                nav button:hover, nav button.active {
                    background: #e8f5e9;
                    color: #28a745;
                }

        .container {
            max-width: 1000px;
            margin: 24px auto;
            padding: 0 16px;
        }

        .login-screen {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: calc(100vh - 70px);
        }

        .login-card {
            background: #fff;
            border-radius: 16px;
            padding: 40px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 4px 24px rgba(0,0,0,.12);
            text-align: center;
        }

            .login-card h2 {
                color: #28a745;
                margin-bottom: 8px;
                font-size: 24px;
            }

            .login-card p {
                color: #888;
                font-size: 14px;
                margin-bottom: 24px;
            }

            .login-card input {
                width: 100%;
                padding: 12px;
                border: 2px solid #e0e0e0;
                border-radius: 8px;
                font-size: 16px;
                margin-bottom: 16px;
                outline: none;
            }

                .login-card input:focus {
                    border-color: #28a745;
                }

        .card {
            background: #fff;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 2px 12px rgba(0,0,0,.08);
            margin-bottom: 20px;
        }

            .card h2 {
                font-size: 18px;
                color: #28a745;
                border-bottom: 2px solid #e8f5e9;
                padding-bottom: 8px;
                margin-bottom: 16px;
            }

        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .info-item {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 12px;
        }

            .info-item .label {
                font-size: 12px;
                color: #888;
                margin-bottom: 4px;
            }

            .info-item .value {
                font-size: 15px;
                font-weight: 600;
            }

        .ms-box {
            background: linear-gradient(135deg,#28a745,#1a6e1a);
            color: #fff;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 12px;
        }

            .ms-box .ms-type {
                font-size: 20px;
                font-weight: 700;
                margin-bottom: 8px;
            }

            .ms-box .ms-detail {
                font-size: 13px;
                opacity: .9;
                margin-bottom: 4px;
            }

        .progress-bar {
            background: rgba(255,255,255,.3);
            border-radius: 8px;
            height: 16px;
            margin-top: 10px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: #fff;
            border-radius: 8px;
            transition: width .5s;
        }

        .workout-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill,minmax(280px,1fr));
            gap: 16px;
        }

        .workout-card {
            background: #fff;
            border-radius: 10px;
            padding: 18px;
            box-shadow: 0 2px 8px rgba(0,0,0,.08);
            border-left: 4px solid #28a745;
        }

            .workout-card h3 {
                color: #1a6e1a;
                margin-bottom: 8px;
                font-size: 16px;
            }

            .workout-card p {
                font-size: 13px;
                color: #666;
                margin-bottom: 4px;
            }

        .spots {
            font-weight: 700;
            color: #28a745;
            font-size: 13px;
        }

            .spots.full {
                color: #dc3545;
            }

        .btn {
            padding: 9px 18px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            width: 100%;
            margin-top: 10px;
        }

        .btn-primary {
            background: #28a745;
            color: #fff;
        }

        .btn-danger {
            background: #dc3545;
            color: #fff;
        }

        .btn:hover {
            opacity: .85;
        }

        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .no-ms {
            background: #fff3cd;
            border: 1px solid #ffc107;
            border-radius: 8px;
            padding: 16px;
            color: #856404;
        }

        section {
            display: none;
        }

            section.active {
                display: block;
            }

        #toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: #333;
            color: #fff;
            padding: 12px 20px;
            border-radius: 8px;
            display: none;
            font-size: 14px;
            z-index: 9999;
        }
    </style>
</head>
<body>

    <div id="login-view" class="login-screen">
        <div class="login-card">
            <h2>🏃 SportClub</h2>
            <p>Введите ваш номер участника (ID) для входа</p>
            <input id="login-id" type="number" placeholder="Например: 1" min="1">
            <button class="btn btn-primary" onclick="doLogin()">Войти</button>
        </div>
    </div>

    <div id="app-view" style="display:none">
        <header>
            <h1>🏃 SportClub — Личный кабинет</h1>
            <div id="user-info">Участник #<span id="uid-display"></span></div>
        </header>
        <nav>
            <button class="active" onclick="showTab('profile', this)">Мой профиль</button>
            <button onclick="showTab('schedule', this)">Расписание</button>
            <button onclick="showTab('my-workouts', this)">Мои записи</button>
        </nav>
        <div class="container">
            <section id="profile" class="active">
                <div class="card"><h2>Личные данные</h2><div id="profile-data">Загрузка...</div></div>
                <div class="card"><h2>Мой абонемент</h2><div id="ms-data">Загрузка...</div></div>
            </section>
            <section id="schedule">
                <div class="card"><h2>Предстоящие тренировки</h2><div class="workout-grid" id="schedule-grid">Загрузка...</div></div>
            </section>
            <section id="my-workouts">
                <div class="card"><h2>Мои записи на тренировки</h2><div class="workout-grid" id="my-grid">Загрузка...</div></div>
            </section>
        </div>
    </div>
    <div id="toast"></div>

    <script>
        var API = '';
        var memberId = null;

        function showToast(msg) {
            var t = document.getElementById('toast');
            t.textContent = msg;
            t.style.display = 'block';
            setTimeout(function () { t.style.display = 'none'; }, 3000);
        }

        function showTab(name, btn) {
            document.querySelectorAll('section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
            document.getElementById(name).classList.add('active');
            btn.classList.add('active');

            if (name === 'profile') loadProfile();
            else if (name === 'schedule') loadSchedule();
            else if (name === 'my-workouts') loadMyWorkouts();
        }

        function doLogin() {
            var id = parseInt(document.getElementById('login-id').value);
            if (!id || id < 1) { showToast('Введите корректный ID'); return; }

            fetch(API + '/api/members/' + id)
                .then(r => {
                    if (!r.ok) throw new Error('Участник не найден');
                    return r.json();
                })
                .then(m => {
                    memberId = id;
                    document.getElementById('login-view').style.display = 'none';
                    document.getElementById('app-view').style.display = 'block';
                    document.getElementById('uid-display').textContent = id;
                    loadProfile();
                })
                .catch(e => showToast('Ошибка: ' + e.message));
        }

        function loadProfile() {
            fetch(API + '/api/members/' + memberId)
                .then(r => r.json())
                .then(m => {
                    document.getElementById('profile-data').innerHTML = `
                        <div class="info-grid">
                            <div class="info-item"><div class="label">ФИО</div><div class="value">${m.fullName}</div></div>
                            <div class="info-item"><div class="label">Телефон</div><div class="value">${m.phone}</div></div>
                            <div class="info-item"><div class="label">Email</div><div class="value">${m.email}</div></div>
                            <div class="info-item"><div class="label">Зарегистрирован</div><div class="value">${(m.registeredAt || '').substring(0, 10)}</div></div>
                        </div>`;
                });
        }

        function loadSchedule() {
            fetch(API + '/api/workouts')
                .then(r => r.json())
                .then(workouts => {
                    var grid = document.getElementById('schedule-grid');
                    var html = '';

                    workouts.forEach(w => {
                        var isRegistered = false; // пока просто показываем все кнопки
                        html += `
                            <div class="workout-card">
                                <h3>${w.name}</h3>
                                <p>Тренер: ${w.trainer}</p>
                                <p>Дата: ${new Date(w.startsAt).toLocaleString('ru')}</p>
                                <p>Длительность: ${w.durationMinutes} минут</p>
                                ${w.description ? `<p>${w.description}</p>` : ''}
                                <button class="btn btn-primary" onclick="doRegister(${w.id})">Записаться</button>
                            </div>`;
                    });

                    grid.innerHTML = html || '<p>Нет тренировок</p>';
                });
        }

        async function doRegister(workoutId) {
            try {
                const response = await fetch(API + '/api/workouts/' + workoutId + '/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ memberId: memberId })   // ← ИЗМЕНЕНО
                });

                if (response.ok) {
                    showToast('✅ Вы успешно записаны!');
                    loadMyWorkouts();        // сразу обновляем вкладку "Мои записи"
                } else {
                    const text = await response.text();
                    showToast('❌ ' + (text || 'Не удалось записаться'));
                }
            } catch (e) {
                showToast('Ошибка соединения с сервером');
                console.error(e);
            }
        }

        function loadMyWorkouts() {
            fetch(API + '/api/workouts')
                .then(r => r.json())
                .then(allWorkouts => {
                    fetch(API + '/api/members/' + memberId)
                        .then(r => r.json())
                        .then(member => {
                            const registeredIds = (member.workoutRegistrations || []).map(r => r.workoutId);
                            const myWorkouts = allWorkouts.filter(w => registeredIds.includes(w.id));

                            var grid = document.getElementById('my-grid');
                            if (myWorkouts.length === 0) {
                                grid.innerHTML = '<p>Вы ни на что не записаны</p>';
                                return;
                            }

                            var html = '';
                            myWorkouts.forEach(w => {
                                html += `
                                    <div class="workout-card">
                                        <h3>${w.name}</h3>
                                        <p>Тренер: ${w.trainer}</p>
                                        <p>Дата: ${new Date(w.startsAt).toLocaleString('ru')}</p>
                                        <p>Длительность: ${w.durationMinutes} минут</p>
                                        <button class="btn btn-danger" onclick="doUnregister(${w.id})">Отменить запись</button>
                                    </div>`;
                            });
                            grid.innerHTML = html;
                        });
                });
        }

        function doUnregister(workoutId) {
            fetch(API + '/api/workouts/' + workoutId + '/unregister/' + memberId, { method: 'DELETE' })
                .then(r => {
                    if (r.ok) {
                        showToast('Запись отменена');
                        loadMyWorkouts();
                    } else {
                        showToast('Не удалось отменить');
                    }
                });
        }

        // Enter в поле логина
        document.getElementById('login-id').addEventListener('keypress', e => {
            if (e.key === 'Enter') doLogin();
        });
    </script>
</body>
</html>
